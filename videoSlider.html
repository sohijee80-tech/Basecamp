<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Kit — BaseCamp Studio</title>
    <link rel="stylesheet" href="fonts.css">
    <style>
      :root {
        --pink: #FF5A2E;
        --ink: #070707;
        --muted: #8d8d8d;
        --font-display: 'Etna', 'Arial Black', Arial, sans-serif;
        --font-body: 'Aaux Pro Light', 'Helvetica Neue', Arial, sans-serif;
        --font-med: 'Aaux Pro Medium', 'Helvetica Neue', Arial, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--ink);
        font-family: var(--font-body);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .kit-grid-overlay {
        position: fixed;
        inset: 0;
        background: rgba(7, 7, 7, .94);
        backdrop-filter: blur(14px);
        z-index: 99998;
        opacity: 0;
        visibility: hidden;
        transition: .35s ease;
        overflow-y: auto;
        padding: 90px 24px 60px;
      }

      .kit-grid-overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .kit-grid-panel {
        width: min(1200px, 100%);
        margin: 0 auto;
      }

      .kit-grid-close {
        position: fixed;
        top: 24px;
        right: 24px;
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, .1);
        color: #fff;
        font-size: 28px;
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: .25s;
        z-index: 2;
      }

      .kit-grid-close:hover {
        background: #fff;
        color: #111;
        transform: rotate(90deg);
      }

      .kit-grid-eyebrow {
        display: block;
        font-family: var(--font-med);
        font-size: 12px;
        letter-spacing: .2em;
        color: var(--pink);
        text-transform: uppercase;
      }

      #kitGridTitle {
        font-family: var(--font-display);
        font-size: clamp(28px, 4vw, 52px);
        color: #fff;
        margin-top: 8px;
        text-transform: uppercase;
      }

      .kit-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 36px;
      }

      @media(max-width:900px) {
        .kit-grid {
          grid-template-columns: repeat(2, 1fr)
        }
      }

      @media(max-width:560px) {
        .kit-grid {
          grid-template-columns: 1fr
        }
      }

      .kit-thumb {
        position: relative;
        aspect-ratio: 16/10;
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        background: #111;
        border: 1px solid rgba(255, 255, 255, .08);
        transition: border-color .3s;
      }

      .kit-thumb:hover {
        border-color: rgba(255, 90, 46, .5);
      }

      .kit-thumb video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      .kit-thumb-play {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .kit-thumb-play span {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(0, 0, 0, .45);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: .25s;
      }

      .kit-thumb-play span::after {
        content: "";
        border-style: solid;
        border-width: 9px 0 9px 15px;
        border-color: transparent transparent transparent #fff;
        margin-left: 3px;
      }

      .kit-thumb:hover .kit-thumb-play span {
        background: var(--pink);
        transform: scale(1.08);
      }

      .kit-thumb-name {
        position: absolute;
        left: 14px;
        bottom: 12px;
        color: #fff;
        font-family: var(--font-med);
        font-size: 14px;
        letter-spacing: .02em;
        text-shadow: 0 2px 8px rgba(0, 0, 0, .6);
      }

      .kit-grid-empty {
        color: var(--muted);
        padding: 40px 0;
      }

      .video-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .82);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition: .35s ease;
        z-index: 99999;
      }

      .video-modal.show {
        opacity: 1;
        visibility: visible;
      }

      .video-modal-content {
        position: relative;
        width: min(92vw, 1100px);
        aspect-ratio: 16/9;
        border-radius: 22px;
        overflow: hidden;
        background: #111;
        box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
        transform: scale(.92);
        transition: .35s ease;
      }

      .video-modal.show .video-modal-content {
        transform: scale(1);
      }

      #modalVideo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      .video-close {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, .12);
        color: #fff;
        font-size: 28px;
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: .25s;
        z-index: 2;
      }

      .video-close:hover {
        background: #fff;
        color: #111;
        transform: rotate(90deg);
      }
    </style>
  </head>

      const kitGridOverlay = document.getElementById('kitGridOverlay');
      const kitGridBody = document.getElementById('kitGridBody');
      const kitGridTitle = document.getElementById('kitGridTitle');
      const modall = document.getElementById('videoModal');
      const modalVideo = document.getElementById('modalVideo');
      const closeBtn = document.querySelector('.video-close');

      function openVideoModal(src) {
        modalVideo.src = src;
        modall.classList.add('show');
        modalVideo.load();
        modalVideo.play();
      }

      function closeVideo() {
        modall.classList.remove('show');
        modalVideo.pause();
        modalVideo.currentTime = 0;
        modalVideo.src = '';
      }

      closeBtn.addEventListener('click', closeVideo);

      modall.addEventListener('click', e => {
        if (e.target === modall) closeVideo();
      });

      function renderKitGrid(cat, label) {
        kitGridTitle.textContent = label;

        const items = PROJECTS.filter(p => p.cat === cat);

        if (!items.length) {
          kitGridBody.innerHTML = '<div class="kit-grid-empty">Case studies for this category are coming soon.</div>';
          return;
        }

        // "#t=<seconds>" seeks the video to a still frame as a poster, no extra image assets needed.
        // Set a `poster` field (seconds) per item to override the default 0.5s frame.
        kitGridBody.innerHTML = items.map(p => (
          '<div class="kit-thumb" data-src="' + p.src + '">'
          + '<video muted playsinline preload="metadata" src="' + p.src + '#t=' + (p.poster != null ? p.poster : 0.5) + '"></video>'
          + '<div class="kit-thumb-play"><span></span></div>'
          // + '<div class="kit-thumb-name">' + p.name + '</div>'
          + '</div>'
        )).join('');

        kitGridBody.querySelectorAll('.kit-thumb').forEach(el => {
          el.addEventListener('click', () => openVideoModal(el.getAttribute('data-src')));
        });
      }

      function openKitGrid(cat, label) {
        renderKitGrid(cat, label);
        kitGridOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function closeKitGrid() {
         window.location.href = 'index.html#featured';
      }

      kitGridOverlay.addEventListener('click', e => {
        if (e.target === kitGridOverlay) closeKitGrid();
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          if (modall.classList.contains('show')) {
            closeVideo();
          } else {
            closeKitGrid();
          }
        }
      });

      function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      openKitGrid(getQueryParam('cat') || '', getQueryParam('label') || '');
